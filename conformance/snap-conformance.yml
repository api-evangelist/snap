api: Snap
standards:
  - id: openapi-3.0
    conforms: true
    evidence: >-
      Snap publishes OpenAPI 3.0.3 for the Conversions API in its own SDK repos
      (github.com/Snapchat/business-sdk-java, business-sdk-go and
      business-sdk-v3-java all ship api/openapi.yaml). Harvested to openapi/.
      No OpenAPI is published for the Ads API, Snap Kit or Camera Kit.
  - id: oauth2
    conforms: true
    evidence: >-
      Marketing API uses the OAuth 2.0 authorization code grant with refresh
      tokens (authorize + access_token endpoints on accounts.snapchat.com),
      Bearer access tokens, 3600s TTL.
  - id: oauth2-pkce
    conforms: true
    evidence: >-
      The Ads MCP authorization server advertises
      code_challenge_methods_supported: ["S256"] at
      /.well-known/oauth-authorization-server/ads.
  - id: rfc8414
    conforms: partial
    evidence: >-
      OAuth 2.0 Authorization Server Metadata is served for the MCP resource at
      /.well-known/oauth-authorization-server/ads (200), but NOT at the unscoped
      path and NOT at all on accounts.snapchat.com for the Marketing API.
  - id: rfc9728
    conforms: true
    evidence: >-
      OAuth 2.0 Protected Resource Metadata served at
      https://mcp.snapchat.com/.well-known/oauth-protected-resource/ads (200)
      and advertised in the WWW-Authenticate challenge on a 401.
  - id: rfc7591
    conforms: false
    evidence: >-
      Dynamic client registration is explicitly unsupported; each agent uses a
      client id Snap pre-registered.
  - id: mcp
    conforms: true
    evidence: >-
      Hosted streamable-HTTP MCP server at https://mcp.snapchat.com/ads,
      read-only, OAuth-protected. Verified by a tools/list POST returning 401
      with an RFC 9728 resource_metadata challenge.
  - id: oidc
    conforms: partial
    evidence: >-
      Snap Kit / Login Kit provides "Login with Snapchat" with OpenID Connect
      support. No /.well-known/openid-configuration is served on any Snap host
      (404 on accounts.snapchat.com, api.snapkit.com, adsapi.snapchat.com), and
      the MCP authorization server explicitly does not support OpenID Connect.
  - id: rfc6902
    conforms: true
    evidence: >-
      Single-entity PATCH uses JSON Patch (application/json-patch+json) with
      add/remove/replace/test operations (error codes E1165/E1166).
  - id: rfc9457
    conforms: false
    evidence: >-
      Errors use a custom request_status/sub_request_status envelope, not
      application/problem+json.
  - id: rfc6750
    conforms: true
    evidence: >-
      Bearer token in the Authorization header with a WWW-Authenticate challenge
      carrying error="invalid_token" on expiry. Note the Conversions API V3
      deviates — it carries the credential as an access_token query parameter,
      which RFC 6750 §2.3 discourages.
  - id: pagination
    conforms: true
    evidence: >-
      Cursor pagination via paging.next_link and a limit parameter (50-1000),
      ordered by CreatedAt.
  - id: idempotency
    conforms: false
    evidence: >-
      No client-supplied idempotency key on any Snap API. The Conversions API
      offers event_id deduplication within a 48h window, which is
      reporting-level dedup, not request idempotency — a retried POST is not
      guaranteed to be a no-op.
  - id: rate-limit-headers
    conforms: false
    evidence: >-
      Limits are published as prose (20 req/s per app, 10 req/s per token) but
      no X-RateLimit-*, RateLimit-* or Retry-After header is documented, and the
      429 carries no reset signal.
  - id: rfc8594
    conforms: false
    evidence: >-
      Deprecations are announced via the Announcements page and an email list
      rather than Sunset/Deprecation HTTP headers.
  - id: webhooks
    conforms: partial
    evidence: >-
      Lead-generation webhooks are real and HMAC-signed, but Snap publishes
      neither the signature header name nor the digest algorithm, so signature
      verification cannot be implemented from the public docs.
  - id: asyncapi
    conforms: false
    evidence: No AsyncAPI document is published for any Snap event surface.
  - id: fhir-r4
    conforms: false
  - id: scim
    conforms: false

compliance:
  published: false
  trust_center: https://trust.snap.com/
  note: >-
    Snap Inc. publishes a trust center (a SecurityPal "Snap Assurance Profile"),
