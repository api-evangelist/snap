- name: Snapchat Ads MCP
  description: >-
    Snap's first-party hosted Model Context Protocol server, letting supported agents read the caller's
    authorized Snapchat Ads data over streamable HTTP. Read-only in this release; write access is documented
    as planned. OAuth 2.0 with PKCE against pre-registered client ids for Claude, Codex, ChatGPT, Antigravity,
    and Gemini, scoped to snapads.read. Onboarding is self-service: an organization admin approves each
    agent, then each member authorizes their own access, and a member reaches only what their existing
    Snapchat Ads permissions already allow.
  humanURL: https://developers.snap.com/marketing-api/Ads-MCP/Introduction
  baseURL: https://mcp.snapchat.com/ads
  tags:
  - MCP
  - Agents
  - Advertising
  properties:
  - type: MCPServer
    url: mcp/snap-mcp.yml
  - type: ToolCrosswalk
    url: mcp/snap-tool-crosswalk.yml
