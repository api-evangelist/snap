aid: snap
name: Snap
description: >-
  Snap Inc. is the technology company behind Snapchat, Bitmoji, Spectacles, and
  Lens Studio. Its Snap for Developers program exposes several public APIs and
  SDKs: the Snapchat Marketing API (Ads API, Ads Gallery API, Conversions API,
  and Public Profile API) for programmatically managing organizations, ad
  accounts, campaigns, ad squads, ads, creatives, audiences, measurement, and
  server-to-server conversion events; Snap Kit / Login Kit for OAuth 2.0 and
  OpenID Connect powered "Login with Snapchat", Creative Kit, and Bitmoji Kit;
  and Camera Kit for embedding Snap's augmented-reality Lenses into third-party
  apps and web experiences. The Marketing API is an OAuth 2.0 REST API served
  from adsapi.snapchat.com/v1 with cursor pagination and a structured request
  envelope. Snap publishes first-party OpenAPI 3.0 for the Conversions API in
  its own Business SDK repositories, ships a hosted read-only MCP server for
  Snapchat Ads at mcp.snapchat.com/ads with pre-registered OAuth clients for
  five agents, and delivers lead-generation leads by HMAC-signed webhook.
  First-party SDKs are published for Java, Python, PHP, Ruby, Go, JavaScript
  (Camera Kit on npm), Android, and iOS. Snap was surfaced as a portfolio
  company of General Catalyst and enriched into the API Evangelist network.
