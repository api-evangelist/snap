    url: authentication/snap-authentication.yml
  - type: OAuthScopes
    url: scopes/snap-scopes.yml
  - type: WellKnown
    url: well-known/snap-well-known.yml
- name: Snap Kit / Login Kit
  description: >-
    OAuth 2.0 and OpenID Connect identity platform for "Login with Snapchat", plus Creative Kit and Bitmoji
    Kit. Lets third-party apps authenticate Snapchatters, fetch approved profile fields, and share content
    back into Snapchat.
  humanURL: https://developers.snap.com/snap-kit/login-kit/Technical-Documentation/OAuth2
  baseURL: https://api.snapkit.com
  tags:
  - Authentication
  - Identity
  - OpenID Connect
- name: Camera Kit
  description: >-
    SDK and API for embedding Snap's augmented-reality Lenses (Lens Studio content) into third-party mobile
    and web apps, including a push-to-device API for managing Lens groups and experiences.
  humanURL: https://developers.snap.com/camera-kit/home
  baseURL: https://camera-kit-api.snapar.com
