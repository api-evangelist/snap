  url: null
  checked: '2026-08-13'
  note: >-
    Snap publishes no status page for any developer surface. status.snap.com and
    status.snapchat.com do not resolve (connection failure), and
    developers.snap.com/status returns 404.
  false_positive:
    url: https://snapchat.statuspage.io
    http_status: 200
    verdict: not-a-status-page
    finding: >-
      snapchat.statuspage.io answers 200 but is an UNCONFIGURED Statuspage
      template. Its API summary lists exactly two components literally named
      "API (example)" and "Management Portal (example)", both created
      2021-12-20, never updated, with zero incidents ever recorded. It is a
      reserved shell, not an operational status page, and must not be credited
      as one — the 200 is the trap.
    evidence_url: https://snapchat.statuspage.io/api/v2/summary.json

