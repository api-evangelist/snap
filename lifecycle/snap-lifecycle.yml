data_retention:
  - subject: Async report downloads
    retention: 7 days
    source: https://developers.snap.com/api/marketing-api/Ads-API/changelog
  - subject: MCP data
    retention: >-
      Governed by the Snap Developer Terms / Business Services Terms, which set
      limits on how long data returned through Snap APIs may be retained and
      when it must be deleted. Compliance is the integrator's responsibility.
    source: https://developers.snap.com/marketing-api/Ads-MCP/Introduction

