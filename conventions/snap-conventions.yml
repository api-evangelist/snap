generated: '2026-08-13'
method: searched
source: https://developers.snap.com/api/marketing-api/Ads-API/api-patterns
api: Snapchat Marketing API
base_url: https://adsapi.snapchat.com/v1
auth:
  style: oauth2-bearer
  header: "Authorization: Bearer {access_token}"
  ref: authentication/snap-authentication.yml
versioning:
  style: uri-path
  current: v1
  example: https://adsapi.snapchat.com/v1/...
pagination:
  style: cursor
  request_params:
    limit: "integer, min 50, max 1000, entities per page"
  response_fields:
    next_link: paging.next_link
    cursor_param: cursor
  ordering: "Paginated calls are ordered by CreatedAt; non-paginated calls are unsorted."
  sorting_param: "sort — return entities in created/last-updated order (usable with or without limit)."
bulk:
  read: "POST .../get_{entity}s_by_ids with {\"entity_ids\":[{\"id\":\"...\"}]}"
  write: "Create/Update endpoints accept a JSON array of entities in one POST."
  entity_request_limits:
    Creative: 10
    Media: 10
    Organization: 15
    "Ad Account": 15
    Segments: 15
    Campaign: 30
    "Ad Squad": 30
    Ad: 30
patch:
  media_type: application/json-patch+json
  spec: RFC 6902 (JSON Patch)
  scope: single-entity PATCH
error_envelope:
  request_status: "SUCCESS | ERROR (top-level request outcome)"
  request_id: "opaque per-request id, echoed for support/tracing"
  sub_request_status: "SUCCESS | ERROR per entity in a batch"
  sub_request_error_reason: "Error code: <code>, message: <message> : [<context>]"
  ref: errors/snap-error-codes.yml
idempotency:
  supported: false
  note: >-
    Snap does not document a client-supplied idempotency key for the Marketing
    API. Mutations are batched arrays; retries are not deduplicated by the
    provider. Callers should guard against duplicate creation client-side.
request_tracing:
  field: request_id
  note: "Present on every response; include it when contacting Snap support."
rate_limiting:
  published_limits: true
  response_headers: false
  status_code: 429
  ref: rate-limits/snap-rate-limits.yml
  note: >-
    Limits are documented as prose numbers (20 req/s per app, 10 req/s per
    access token) but Snap emits NO rate-limit response headers — no
    X-RateLimit-*, no RateLimit-*, no Retry-After on the 429. A caller cannot
    observe remaining budget or reset time at runtime and can only react after
    exhaustion.
webhooks:
  surface: Lead generation
  signing: hmac
  secret_delivery: "hmacSecret returned in the create-integration response"
  signature_header: undocumented
  algorithm: undocumented
  ref: asyncapi/snap-lead-gen-webhooks.yml
  note: >-
    Snap states the HMAC secret is used to verify authenticity but publishes
    neither the header name nor the digest algorithm, so verification is not
    implementable from the public docs.
conversions_api:
  base_url: https://tr.snapchat.com
  current_version: v3
  path_shape: "/v3/{asset_id}/events  (asset_id = Pixel ID for web/offline, Snap App ID for app)"
  auth: "access_token query parameter (static long-lived token)"
  batch:
    envelope_field: data
    max_events_per_request: 2000
  deduplication:
    key: event_id
    window: 48h
    note: "Dedup against Pixel/MMP events; reporting-level dedup, NOT request idempotency."
  pii:
    hashing: "SHA-256 required on matching identifiers (em, ph)"
  validation:
    endpoint: "/v3/{asset_id}/events/validate"
    ref: sandbox/snap-sandbox.yml
  ref: openapi/snap-conversions-api-v3-openapi.yml
monetary_values:
  unit: micro-currency
  rule: "1.00 in the Ad Account's currency equals 1,000,000 micro units."
  currencies: [USD, CAD, GBP, EUR, AUD]
  source: https://developers.snap.com/api/marketing-api/Ads-API/monetary-values
identifiers:
  format: uuid
  note: All Marketing API entity ids are UUIDs.
agent_surface:
  mcp: https://mcp.snapchat.com/ads
  access: read-only
  scope: snapads.read
  ref: mcp/snap-mcp.yml
