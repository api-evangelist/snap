    method: POST tools/list
    http_status: 401
    www_authenticate: 'Bearer resource_metadata="https://mcp.snapchat.com/.well-known/oauth-protected-resource/ads"'
  - fetched: '2026-08-13'
    url: https://mcp.snapchat.com/.well-known/oauth-protected-resource/ads
    http_status: 200
    content_type: application/json
  - fetched: '2026-08-13'
    url: https://mcp.snapchat.com/.well-known/oauth-authorization-server/ads
