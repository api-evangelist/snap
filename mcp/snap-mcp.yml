notes: >-
  Supersedes the 2026-07-21 derived candidate tool list, which recorded
  `mode: none` because no server had been found. Snap does in fact ship a
  hosted remote MCP endpoint. Prompt-injection warning is Snap's own: their docs
  state that instructions concealed in tool outputs do not originate from the
  Snap MCP server and that the server should be treated like any third-party
  integration.
