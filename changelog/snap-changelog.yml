notes: >-
  Snap runs three separate change surfaces for the Marketing API — a dated
  Change Log (documentation-level, most entries), a Breaking Changes Log
  (behavioural, sparse, oldest entry April 2020), and an Announcements page with
  forward effective dates — plus independent changelogs for Snap Kit and Camera
  Kit. Only the recent window is captured.
