currency:
  assessed: '2026-08-13'
  finding: >-
    Snap's SDK estate is bimodal. Camera Kit is current — @snap/camera-kit
    published 1.20.0 on 2026-08-07, days before this assessment. Every
    server-side Business SDK is stale at the registry: PyPI snap-business-sdk
    1.0.0 (2022-12-20), RubyGems snap_business 1.0.1 (2023-01-30), Go module
    v1.0.0 (2022-09-16). All three predate the Conversions API V3 endpoint they
    would need to wrap — Snap's answer to V3 was a NEW repo
    (business-sdk-v3-java, last pushed 2025-05-22) rather than a release of the
    existing packages, so a developer installing the published Python, Ruby or Go
    package today gets a v2-only client for an API Snap has moved past.
  maven_central: >-
    Snap publishes NOTHING to Maven Central. A search for g:com.snapchat*
    returned 0 artifacts on 2026-08-13, unchanged from the 2026-07-21 pass, so
    both Java SDKs must be built from source.
  packagist: "snapchat/business-sdk is not registered; the PHP SDK is VCS-install only."

notes: >-
  `version: null` on a GitHub-distributed package means the registry has no
  release metadata to read, not that the check was skipped — `published` for
  those entries is the last push to the repo's default branch, labelled with
  `published_basis` so it is never mistaken for a release date.
